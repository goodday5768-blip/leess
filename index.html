<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>이승수 영어 시험앱</title>
<!--hub-->
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1d21;--sub:#686a72;--line:#e1e0da;--acc:#2f5bd3;--acc2:#e8eefc;--box:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--box:#29292e}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--box:#29292e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
.brand{margin:0 0 16px;background:#fff;border:1px solid #E8D9B0;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.10);color-scheme:light}
.brand img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:6px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px;-webkit-user-select:none;user-select:none}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 14px;font-size:14px;color:var(--sub);min-height:22px}
.crumb a{color:var(--acc);text-decoration:none}
.crumb .sep{opacity:.6}
.crumb:empty{display:none}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 10px;padding:8px 12px 8px 8px;font-size:15px}
.label{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.5px}
.label:first-child{margin-top:4px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:left;font-weight:400;text-decoration:none}
.item:active{transform:scale(.99)}
.item .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--acc2);overflow:hidden}
.item .ic img{width:100%;height:100%;display:block}
.item .tx{flex:1;min-width:0}
.item .nm{display:block;font-size:17px;font-weight:700;line-height:1.35}
.item .ds{display:block;font-size:14px;color:var(--sub);line-height:1.4;margin-top:2px}
.item .ch{flex:none;color:var(--sub);font-size:20px}
.item.soon{opacity:.5;cursor:default}
.item.soon .ch{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.main .item{padding:18px 16px}
.main .item .ic{width:56px;height:56px;font-size:30px}
.main .item .nm{font-size:20px}
.teacher{margin-top:24px;padding:14px;border:1px dashed var(--line);border-radius:14px}
.teacher h2{font-size:15px;margin:0 0 8px}
.teacher p{margin:8px 0 0;font-size:13px;color:var(--sub)}
.teacher[hidden]{display:none}
.codecard{margin:0 0 16px;padding:16px;border:1px solid var(--acc);border-radius:14px;background:var(--acc2)}
.codecard[hidden]{display:none}
.codelink[hidden]{display:none}
.codecard h2{margin:0 0 6px;font-size:17px}
.codecard p{margin:0 0 10px;font-size:14px;color:var(--sub)}
.codecard .row{display:flex;gap:8px}
.codecard input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.codemsg{margin:8px 0 0;font-size:14px;min-height:1em}
.codelink{display:block;margin:20px auto 0;padding:6px 10px;background:none;border:0;color:var(--sub);font-size:13px;font-weight:400;text-decoration:underline}
</style>
<script>/* 통합앱: 이 브라우저의 모든 시험앱 기기ID(…:device)를 한 번에 넘기고 받는다 — pwa.py의 ?dv= 자리에 쓴다 */
var HUBDV = {
  pack: function () {
    var m = {}, n = 0;
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (!/:device$/.test(k)) continue; var v = JSON.parse(localStorage.getItem(k) || '""'); if (/^[0-9a-f]{8}$/i.test(v)) { m[k] = v; n++; } } } catch (e) {}
    return n ? encodeURIComponent(JSON.stringify(m)) : '';
  },
  take: function (s) {
    try { var m = JSON.parse(s); for (var k in m) if (/^[\w.:-]+:device$/.test(k) && /^[0-9a-f]{8}$/i.test(m[k]) && !localStorage.getItem(k)) localStorage.setItem(k, JSON.stringify(m[k])); } catch (e) {}
  }
};
</script>

<script>/* 홈 화면 앱(pwa.py): 아이폰이 아니면 manifest를 건다 · 주소의 ?dv=기기ID 는 저장된 ID가 없을 때만 받는다 */
(function () {
  var K = "hub:none", ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (!/Android/i.test(ua) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var inapp = /KAKAOTALK|\bLine\//i.test(ua);
    if (dv && (app || (q.get('via') === 'out' && !inapp))) HUBDV.take(dv);
    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>

    }

    var h = trail.length > 1 ? '<button type="button" class="ghost back" id="up">‹ 뒤로</button>' : '';
    h += '<div class="list' + (trail.length === 1 ? ' main' : '') + '">';
    (node.children || []).forEach(function (c) { h += c.label ? '<div class="label">' + esc(c.label) + '</div>' : item(c, ids); });
    $('view').innerHTML = h + '</div>';
    var up = $('up');
    if (up) up.onclick = function () { location.hash = '#/' + ids.slice(0, -1).join('/'); };
    document.title = trail.length > 1 ? node.name + ' · ' + CAT.title : CAT.title;
    if (render.done) window.scrollTo(0, 0);
    render.done = true;
  }
  // 앱을 열 때 돌아올 주소를 남긴다 — 각 앱의 「← 전체 앱」 단추(hubback.py)가 이것을 본다(같은 탭에서만)
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-app]');
    if (!a) return;
    if (T && a.dataset.tk) {   // 그 앱의 코드 자리에 넣고, 앱이 열리면 선생님 화면을 바로 띄우게(hubback.py)
      if (!code()) { e.preventDefault(); showCode('먼저 선생님 코드를 넣으세요.'); return; }
      try { localStorage.setItem(a.dataset.tk, JSON.stringify(code())); sessionStorage.setItem('hub:teacher', '1'); } catch (err) {}
    }
    try { sessionStorage.setItem('hub:back', location.href); } catch (err) {}
  });
  if (!T) { var cc = $('codeChange'); if (cc) cc.remove(); }   // 학생 통합앱엔 선생님 코드 단추가 없다(10-02 — display:block이 hidden을 덮어 보이던 결함)
  function showCode(m) { $('codeCard').hidden = false; $('codeMsg').textContent = m || ''; $('codeIn').focus(); window.scrollTo(0, 0); }
  if (T) {
    $('codeChange').hidden = false;
    $('codeChange').onclick = function () { $('codeIn').value = ''; showCode(); };
    if (!code()) showCode();
    $('codeOk').onclick = async function () {   // 서버(구글 시트)에 한 번 물어 맞는 코드인지 확인
      var c = $('codeIn').value.trim(); if (!c) return;
      $('codeMsg').textContent = '확인하는 중…'; $('codeOk').disabled = true;
      var ok = null;
      try { var r = await fetch(CAT.check.url + '?teacher=' + encodeURIComponent(c) + '&app=' + encodeURIComponent(CAT.check.app) + '&_=' + Date.now()); var j = await r.json(); ok = j.error !== 'code'; } catch (err) {}
      $('codeOk').disabled = false;
      if (ok === false) { $('codeMsg').textContent = '코드가 맞지 않습니다.'; return; }
      try { localStorage.setItem(CK, JSON.stringify(c)); } catch (err) {}
      $('codeCard').hidden = true; $('codeIn').value = '';
      if (ok === null) alert('서버에 연결하지 못해 확인은 못 했지만 저장했습니다. 코드가 틀리면 앱에서 다시 알려 줍니다.');
    };
    $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('codeOk').click(); });
  }
  addEventListener('hashchange', render);
  render();
  // 선생님 링크: 제목을 7번 누르면 보인다(학교 앱과 같은 방식)
  var taps = 0, timer = null;
  if (!T) $('ttl').addEventListener('click', function () {
    taps++; clearTimeout(timer); timer = setTimeout(function () { taps = 0; }, 1500);
    if (taps < 7) return;
    taps = 0;
    var t = $('teacher');
    if (!t.hidden) { t.hidden = true; return; }
    t.innerHTML = '<h2>선생님</h2><div class="list"><a class="item" href="' + esc(location.origin + '/' + CAT.teacher_hub.repo + '/') + '"><span class="ic">🧑‍🏫</span><span class="tx"><span class="nm">' + esc(CAT.teacher_hub.title) + '</span><span class="ds">모든 앱의 선생님 화면</span></span><span class="ch">›</span></a></div>';
    t.hidden = false;
    t.scrollIntoView({behavior: 'smooth'});
  });
})();
</script>

<style>
#pwaBar{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:9px 10px 9px 12px;border:1px solid var(--line,#e1e0da);border-radius:12px;background:var(--acc2,#e8eefc);color:var(--ink,#1c1d21);font-size:14px;line-height:1.45}

<div id="pwaBar" hidden><span>📲 <b>홈 화면에 앱으로 추가</b>하면 다음부터 아이콘으로 바로 열립니다.</span><button type="button" id="pwaHow">방법 보기</button><button type="button" class="ghost" id="pwaX" aria-label="안내 닫기">✕</button></div>
<button type="button" id="pwaLink" hidden>📲 홈 화면에 앱으로 추가하는 방법</button>
<div id="pwaSheet" hidden role="dialog" aria-modal="true" aria-labelledby="pwaT"><div class="pwa-box"><h3 id="pwaT">홈 화면에 앱으로 추가</h3><div id="pwaBody"></div><button type="button" class="ghost pwa-go" id="pwaClose">닫기</button></div></div>
<script>/* 홈 화면 앱 설치 안내(pwa.py) — 홈 화면 앱으로 열었으면 막대·링크가 보이지 않는다 */
(function () {
  var K = "hub:none", UA = navigator.userAgent, base = location.origin + location.pathname, deferred = null, saved = null;
  var HIDE = 'pwa-hide:' + location.pathname, $ = function (id) { return document.getElementById(id); };
  var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  try { if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  var SHARE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="공유"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>';
  function env(u) {
    var fake = !!u; u = u || UA;
    var ios = /iP(hone|ad|od)/.test(u) || (!fake && !/Android/i.test(u) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (/KAKAOTALK/i.test(u)) return {k: 'kakao', ios: ios};
    if (/\bLine\//i.test(u)) return {k: 'line', ios: ios};
    if (/NAVER\(inapp|Instagram|FBAN|FBAV|DaumApps|BAND\/|everytimeApp|; wv\)/i.test(u) || (ios && !/Safari\//.test(u))) return {k: 'inapp', ios: ios};
    if (ios) return {k: 'ios', ios: true};
    if (/Android/i.test(u)) return {k: /SamsungBrowser/i.test(u) ? 'samsung' : 'android', ios: false};
    return {k: 'pc', ios: false};
  }
  function dev() { return HUBDV.pack(); }
  function outUrl(extra) { var d = dev(), p = d ? ['dv=' + d, 'via=out'] : []; if (extra) p.push(extra); return base + (p.length ? '?' + p.join('&') : ''); }
  function body(v) {
    var menu = '화면 위나 아래의 <b>⋯</b> 또는 <b>⋮</b> 메뉴 → <b>다른 브라우저로 열기</b>' + (v.ios ? '(또는 <b>Safari로 열기</b>)' : '');
    var again = '새로 열린 화면에서 <b>📲 방법 보기</b>를 한 번 더 누르세요.';
    if (v.k === 'kakao' || v.k === 'line') return '<p>' + (v.k === 'kakao' ? '카카오톡' : 'LINE') + ' 안의 화면에서는 홈 화면에 추가할 수 없습니다. 먼저 <b>' + (v.ios ? 'Safari' : '인터넷 앱(크롬·삼성 인터넷)') + '</b>로 여세요.</p>' +
      '<button type="button" class="pwa-go" id="pwaOut">' + (v.ios ? 'Safari로 열기' : '브라우저로 열기') + '</button>' +
      '<p class="pwa-s">버튼을 눌러도 넘어가지 않으면: ' + menu + '</p><p>' + again + '</p>';
    if (v.k === 'inapp') return '<p>이 앱 안의 화면에서는 홈 화면에 추가할 수 없습니다.</p><ol><li>' + menu + '</li><li>' + again + '</li></ol>';
    if (v.k === 'ios') return '<ol><li>주소창 옆의 <b>공유</b> 버튼 ' + SHARE + '을 누르세요.<br><span class="pwa-s">공유 버튼이 안 보이면 주소창의 <b>⋯</b>를 먼저 누르세요.</span></li>' +
      '<li>목록을 위로 올려 <b>홈 화면에 추가</b>를 누르세요.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝입니다.</li></ol>' +
      '<p class="pwa-s">아이폰은 홈 화면 앱을 따로 저장합니다. 아이콘으로 처음 열 때 이름과 동의를 한 번 더 하고, 그 뒤로는 <b>아이콘으로만</b> 여세요.</p>';
    if (deferred) return '<p>아래 버튼을 누르고 <b>설치</b>를 누르면 끝입니다.</p><button type="button" class="pwa-go" id="pwaInstall">앱 설치</button>';
    if (v.k === 'samsung') return '<ol><li>화면 아래 <b>≡</b> 메뉴를 누르세요.</li><li><b>페이지 추가</b>(또는 <b>현재 페이지 추가</b>) → <b>홈 화면</b>을 누르세요.</li><li><b>추가</b>를 누르면 끝입니다.</li></ol>';
    if (v.k === 'android') return '<ol><li>오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li><li><b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.</li><li><b>설치</b>(또는 <b>추가</b>)를 누르면 끝입니다.</li></ol>';
    return '<p>휴대폰에서 이 주소를 열어 추가하세요. 컴퓨터(크롬·엣지)에서는 주소창 오른쪽의 <b>설치</b> 아이콘을 누르면 됩니다.</p>';
  }
  function show(v) {
    var real = !v; v = v || env();
    $('pwaBody').innerHTML = body(v);
    var out = $('pwaOut'), ins = $('pwaInstall');
    if (out) out.onclick = function () { location.href = v.k === 'kakao' ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(outUrl()) : outUrl('openExternalBrowser=1'); };
    if (ins) ins.onclick = function () { var p = deferred; deferred = null; p.prompt(); p.userChoice.then(function (c) { if (c.outcome === 'accepted') hide(); }).catch(function () {}); };
    if (real && v.k === 'ios' && dev() && saved === null) { saved = location.href; history.replaceState(history.state, '', base + '?dv=' + dev()); }   // 아이폰: 추가할 때의 주소에 기기ID
    $('pwaSheet').hidden = false;
  }
  function hide() { $('pwaSheet').hidden = true; if (saved !== null) { history.replaceState(history.state, '', saved); saved = null; } }
  window.PWA = {env: env, show: function (u) { show(env(u)); }};   // 점검용: PWA.show('… KAKAOTALK …')
  $('pwaClose').onclick = hide;
  $('pwaSheet').addEventListener('click', function (e) { if (e.target === this) hide(); });
  var home = $('home'), bar = $('pwaBar'), link = $('pwaLink'), notice = $('notice');
  if (app || !home) return;
  home.insertBefore(bar, notice && notice.parentNode === home ? notice.nextSibling : home.firstChild);
  home.appendChild(link);
  var off = false; try { off = localStorage.getItem(HIDE) === '1'; } catch (e) {}
  bar.hidden = off || env().k === 'pc';
  link.hidden = false;
  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
  addEventListener('appinstalled', function () { bar.hidden = link.hidden = true; hide(); });
})();
</script>
