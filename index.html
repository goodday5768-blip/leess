<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>이승수 영어 시험앱</title>
<!--hub-->
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1d21;--sub:#686a72;--line:#e1e0da;--acc:#2f5bd3;--acc2:#e8eefc;--box:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--box:#29292e}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--box:#29292e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
.brand{margin:0 0 16px;background:#fff;border:1px solid #E8D9B0;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.10);color-scheme:light}
.brand img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:6px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px;-webkit-user-select:none;user-select:none}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 14px;font-size:14px;color:var(--sub);min-height:22px}
.crumb a{color:var(--acc);text-decoration:none}
.crumb .sep{opacity:.6}
.crumb:empty{display:none}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 10px;padding:8px 12px 8px 8px;font-size:15px}
.label{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.5px}
.label:first-child{margin-top:4px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:left;font-weight:400;text-decoration:none}
.item:active{transform:scale(.99)}
.item .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--acc2);overflow:hidden}
.item .ic img{width:100%;height:100%;display:block}
.item .tx{flex:1;min-width:0}
.item .nm{display:block;font-size:17px;font-weight:700;line-height:1.35}
.item .ds{display:block;font-size:14px;color:var(--sub);line-height:1.4;margin-top:2px}
.item .ch{flex:none;color:var(--sub);font-size:20px}
.item.soon{opacity:.5;cursor:default}
.item.soon .ch{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.main .item{padding:18px 16px}
.main .item .ic{width:56px;height:56px;font-size:30px}
.main .item .nm{font-size:20px}
.teacher{margin-top:24px;padding:14px;border:1px dashed var(--line);border-radius:14px}
.teacher h2{font-size:15px;margin:0 0 8px}
.teacher p{margin:8px 0 0;font-size:13px;color:var(--sub)}
.teacher[hidden]{display:none}
.codecard{margin:0 0 16px;padding:16px;border:1px solid var(--acc);border-radius:14px;background:var(--acc2)}
.codecard[hidden]{display:none}
.codelink[hidden]{display:none}
.codecard h2{margin:0 0 6px;font-size:17px}
.codecard p{margin:0 0 10px;font-size:14px;color:var(--sub)}
.codecard .row{display:flex;gap:8px}
.codecard input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.codemsg{margin:8px 0 0;font-size:14px;min-height:1em}
.codelink{display:block;margin:20px auto 0;padding:6px 10px;background:none;border:0;color:var(--sub);font-size:13px;font-weight:400;text-decoration:underline}
</style>
<script>/* 통합앱: 이 브라우저의 모든 시험앱 기기ID(…:device)를 한 번에 넘기고 받는다 — pwa.py의 ?dv= 자리에 쓴다 */
var HUBDV = {
  pack: function () {
    var m = {}, n = 0;
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (!/:device$/.test(k)) continue; var v = JSON.parse(localStorage.getItem(k) || '""'); if (/^[0-9a-f]{8}$/i.test(v)) { m[k] = v; n++; } } } catch (e) {}
    return n ? encodeURIComponent(JSON.stringify(m)) : '';
  },
  take: function (s) {
    try { var m = JSON.parse(s); for (var k in m) if (/^[\w.:-]+:device$/.test(k) && /^[0-9a-f]{8}$/i.test(m[k]) && !localStorage.getItem(k)) localStorage.setItem(k, JSON.stringify(m[k])); } catch (e) {}
  }
};
</script>

<script>/* 홈 화면 앱(pwa.py): 아이폰이 아니면 manifest를 건다 · 주소의 ?dv=기기ID 는 저장된 ID가 없을 때만 받는다 */
(function () {
  var K = "hub:none", ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (!/Android/i.test(ua) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var inapp = /KAKAOTALK|\bLine\//i.test(ua);
    if (dv && (app || (q.get('via') === 'out' && !inapp))) HUBDV.take(dv);
    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>

    if (v.k === 'ios') return '<ol><li>주소창 옆의 <b>공유</b> 버튼 ' + SHARE + '을 누르세요.<br><span class="pwa-s">공유 버튼이 안 보이면 주소창의 <b>⋯</b>를 먼저 누르세요.</span></li>' +
      '<li>목록을 위로 올려 <b>홈 화면에 추가</b>를 누르세요.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝입니다.</li></ol>' +

    if (v.k === 'android') return '<ol><li>오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li><li><b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.</li><li><b>설치</b>(또는 <b>추가</b>)를 누르면 끝입니다.</li></ol>';
    return '<p>휴대폰에서 이 주소를 열어 추가하세요. 컴퓨터(크롬·엣지)에서는 주소창 오른쪽의 <b>설치</b> 아이콘을 누르면 됩니다.</p>';

  function show(v) {

    if (out) out.onclick = function () { location.href = v.k === 'kakao' ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(outUrl()) : outUrl('openExternalBrowser=1'); };
    if (ins) ins.onclick = function () { var p = deferred; deferred = null; p.prompt(); p.userChoice.then(function (c) { if (c.outcome === 'accepted') hide(); }).catch(function () {}); };
    if (real && v.k === 'ios' && dev() && saved === null) { saved = location.href; history.replaceState(history.state, '', base + '?dv=' + dev()); }   // 아이폰: 추가할 때의 주소에 기기ID

  window.PWA = {env: env, show: function (u) { show(env(u)); }};   // 점검용: PWA.show('… KAKAOTALK …')

  $('pwaSheet').addEventListener('click', function (e) { if (e.target === this) hide(); });

  if (app || !home) return;
  home.insertBefore(bar, notice && notice.parentNode === home ? notice.nextSibling : home.firstChild);
  home.appendChild(link);
  var off = false; try { off = localStorage.getItem(HIDE) === '1'; } catch (e) {}
  bar.hidden = off || env().k === 'pc';
  link.hidden = false;
  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
